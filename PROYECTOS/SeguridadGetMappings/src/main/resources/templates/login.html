<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Solarpunk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/solarpunk.css}">
</head>
<body>
    <div class="sp-decor sp-decor--sun" aria-hidden="true"></div>
    <div class="sp-decor sp-decor--leaves" aria-hidden="true"></div>
    <span class="sp-leaf" aria-hidden="true"></span>
    <span class="sp-leaf" aria-hidden="true"></span>
    <span class="sp-leaf" aria-hidden="true"></span>
    <span class="sp-leaf" aria-hidden="true"></span>

    <main class="sp-shell">
        <header class="sp-header">
            <span class="sp-badge">☀ Solarpunk</span>
            <h1 class="sp-title">Acceso al jardín</h1>
            <p class="sp-subtitle">Introduce tus credenciales para entrar.</p>
        </header>

        <form class="sp-form" th:object="${usuarioForm}" th:action="@{/login}" method="post">
            <div class="sp-field">
                <label class="sp-label" for="nombre">Introduce nombre de usuario</label>
                <input class="sp-input" id="nombre" type="text" th:field="*{nombre}" placeholder="tu usuario"/>
            </div>

            <p class="sp-error" th:if="${error}" th:text="${error}"></p>

            <div class="sp-field">
                <label class="sp-label" for="contrasena">Introduce password</label>
                <input class="sp-input" id="contrasena" type="password" th:field="*{contraseña}" placeholder="••••••••"/>
            </div>

            <div class="sp-form-actions">
                <button class="sp-btn sp-btn--sun" type="submit">Enviar</button>
            </div>
        </form>

        <footer class="sp-footer">Cultivando futuros luminosos · ☘</footer>
    </main>
</body>
</html>
